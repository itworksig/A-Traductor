<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/w3css/4/w3.css" />
  <style>
    html,
    body {
      box-sizing: border-box;
      margin: 0;
      width: 360px;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      background: transparent;
      color: #172033;
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: 14px;
      margin: 0;
      user-select: none;
    }

    .panel {
      background: linear-gradient(180deg, #f7fbff 0, #ffffff 88px);
      border: 1px solid #d8e1ef;
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(20, 35, 60, 0.2);
      overflow: hidden;
      padding: 22px 22px 20px;
      position: relative;
      width: 360px;
    }

    .panel::before {
      background: linear-gradient(90deg, #1a73e8, #36c2ff 48%, #7c3aed);
      content: "";
      height: 4px;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
    }

    .panelHeader {
      align-items: flex-start;
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title {
      color: #111827;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: 0;
      line-height: 1.25;
      margin: 0;
      padding-right: 18px;
    }

    #btnClose {
      align-items: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: #536173;
      cursor: pointer;
      display: flex;
      flex: 0 0 auto;
      font-size: 24px;
      height: 32px;
      justify-content: center;
      line-height: 1;
      padding: 0 0 2px;
      width: 32px;
    }

    #btnClose:hover {
      background: #e8f0fe;
      color: #1558c0;
    }

    .formStack {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: #344054;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .select {
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, #536173 50%) right 17px top 19px / 6px 6px no-repeat,
        linear-gradient(135deg, #536173 50%, transparent 50%) right 11px top 19px / 6px 6px no-repeat,
        #f8fafc;
      border: 1px solid #cfd8e6;
      border-radius: 11px;
      box-shadow: 0 1px 0 rgba(20, 35, 60, 0.04);
      color: #172033;
      font-size: 14px;
      font-weight: 650;
      height: 44px;
      line-height: 1.2;
      outline: none;
      padding: 0 38px 0 13px;
      transition: border-color 0.16s, box-shadow 0.16s, background-color 0.16s;
      width: 100%;
    }

    .select:hover {
      background-color: #ffffff;
      border-color: #b8c5d8;
    }

    .select:focus {
      background-color: #ffffff;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
    }

    .divider {
      border: 0;
      border-top: 1px solid #e3e8f0;
      margin: 4px 0 0;
    }

    .actions {
      padding-top: 4px;
    }

    #btnApply {
      background: #1a73e8;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(26, 115, 232, 0.28);
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      height: 44px;
      letter-spacing: 0;
      transition: background-color 0.16s, box-shadow 0.16s, transform 0.16s;
      width: 100%;
    }

    #btnApply:hover {
      background: #1558c0;
      box-shadow: 0 12px 26px rgba(21, 88, 192, 0.32);
      transform: translateY(-1px);
    }

    #btnApply:active {
      box-shadow: 0 6px 16px rgba(21, 88, 192, 0.24);
      transform: translateY(0);
    }

    body.dark {
      color: #eef4ff;
    }

    body.dark .panel {
      background: linear-gradient(180deg, #172033 0, #101828 88px);
      border-color: #2b3547;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
    }

    body.dark .title,
    body.dark .field label {
      color: #eef4ff;
    }

    body.dark #btnClose {
      color: #c9d4e5;
    }

    body.dark #btnClose:hover {
      background: #243047;
      color: #ffffff;
    }

    body.dark .select {
      background:
        linear-gradient(45deg, transparent 50%, #c9d4e5 50%) right 17px top 19px / 6px 6px no-repeat,
        linear-gradient(135deg, #c9d4e5 50%, transparent 50%) right 11px top 19px / 6px 6px no-repeat,
        #182235;
      border-color: #34425a;
      color: #eef4ff;
    }

    body.dark .select:hover,
    body.dark .select:focus {
      background-color: #1e2a40;
    }

    body.dark .divider {
      border-top-color: #2b3547;
    }

    body.dark #btnApply {
      background: #4f8cff;
      box-shadow: 0 10px 22px rgba(79, 140, 255, 0.24);
    }

    body.dark #btnApply:hover {
      background: #6da0ff;
    }

    @media (max-width: 380px) {
      html,
      body,
      .panel {
        width: 320px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">
    <header class="panelHeader">
      <h1 class="title" data-i18n="msgImproveTranslation">Improve translation</h1>
      <button id="btnClose" type="button" aria-label="Close">&times;</button>
    </header>

    <section class="formStack">
      <div class="field">
        <label for="selectOriginalLanguage" data-i18n="selectOriginalLanguage">Select the original website language</label>
        <select class="select" id="selectOriginalLanguage">
          <option value="auto" selected>Auto-detect</option>
        </select>
      </div>

      <div class="field">
        <label for="selectTargetLanguage" data-i18n="selectTargetLanguage">Select target language</label>
        <select class="select" id="selectTargetLanguage">
          <optgroup name="targets" label="Recents" data-i18n-label="msgRecents"></optgroup>
          <optgroup name="all" label="All" data-i18n-label="msgAll"></optgroup>
        </select>
      </div>

      <div class="field">
        <label for="pageTranslatorService" data-i18n="lblPageTranslationService">Page translation service</label>
        <select class="select" id="pageTranslatorService">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="yandex">Yandex</option>
        </select>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="dontSortResults" data-i18n="lblDontSortResults">Do not sort translation results</label>
        <select class="select" id="dontSortResults">
          <option value="yes" data-i18n="msgYes">Yes</option>
          <option value="no" data-i18n="msgNo" selected>No</option>
        </select>
      </div>

      <div class="actions">
        <button data-i18n="btnApply" id="btnApply" type="button">Apply</button>
      </div>
    </section>
  </main>

  <script src="/lib/polyfill.js"></script>
  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/stuff.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/i18n.js"></script>
  <script src="improve-translation.js"></script>
</body>

</html>
