<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/w3css/4/w3.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popupShell">
        <div class="popupActions">
            <div class="actionButton" id="divMenu" title="Options" data-i18n-title="btnOptions">
                <button id="btnMenu" type="button" aria-label="Options">
                    <span class="menuDot"></span>
                </button>
                <select id="btnOptions">
                    <option value="options" selected disabled hidden>Options</option>
                    <option data-i18n="msgChooseAnotherLanguage" value="changeLanguage">Choose another language</option>
                    <option data-i18n="btnNeverTranslateThisLanguage" value="neverTranslateThisLanguage"
                        style="display: none;">Never translate this language</option>
                    <option data-i18n="btnNeverTranslate" value="neverTranslateThisSite">Never translate this site</option>
                    <option data-i18n="btnAlwaysTranslate" value="alwaysTranslateThisSite" data-popupPanelSection2="1">
                        Always translate this site</option>
                    <option data-i18n="btnOpenOnGoogleTranslate" value="translateInExternalSite">Open in google translate
                    </option>
                    <option data-i18n="btnMoreOptions" value="moreOptions">More options</option>
                </select>
                <div id="customOptionsMenu" hidden></div>
            </div>
            <button class="actionButton" id="btnRetranslatePage" type="button" title="Retranslate"
                aria-label="Retranslate">
                <i class="gg-refresh"></i>
            </button>
            <button class="actionButton" id="btnClosePopup" type="button" title="Close" aria-label="Close">
                <i class="gg-close"></i>
            </button>
        </div>

        <section class="languageTabs" data-popupPanelSection="0">
            <button class="tabButton w3-buttonSelected" title="Show original" data-i18n-title="btnRestore"
                value="original">
                <span class="tabLabel" data-i18n="btnMobileOriginal">Original</span>
                <span class="tabMeta" id="originalLanguageName">Unknown</span>
            </button>
            <button class="tabButton" title="Translate" data-i18n-title="btnTranslate" value="en">English</button>
        </section>

        <section class="popupContent">
            <button data-i18n="msgImproveTranslation" id="btnImproveTranslation">Improve translation</button>
            <label class="toggleRow" id="divAlwaysTranslateThisLang">
                <input type="checkbox" class="w3-check" id="cbAlwaysTranslateThisLang" disabled>
                <span id="lblAlwaysTranslateThisLang" data-i18n="lblAlwaysTranslate"
                    data-i18n-ph-value="">Always translate from</span>
            </label>
        </section>

        <section class="popupHiddenControls" hidden>
            <input type="checkbox" class="w3-check" id="cbAlwaysTranslateThisSite">
            <input type="checkbox" class="w3-check" id="cbShowTranslateSelectedButton">
            <input type="checkbox" class="w3-check" id="cbShowOriginalWhenHovering">
            <input type="checkbox" class="w3-check" id="cbShowTranslatedWhenHoveringThisSite">
            <input type="checkbox" class="w3-check" id="cbShowTranslatedWhenHoveringThisLang" disabled>
            <label id="lblShowTranslatedWhenHoveringThisLang" for="cbShowTranslatedWhenHoveringThisLang"
                data-i18n="lblShowTranslatedWhenHoveringThisLang" data-i18n-ph-value="">Show translation when hovering
                over websites in</label>
            <div id="moreOrLess">
                <div id="more"><span data-i18n="more">More</span></div>
                <div id="less"><span data-i18n="less">Less</span></div>
            </div>
        </section>

        <footer class="footerService" id="divIconTranslate">
            <span id="serviceFooterLabel">Google Translate</span>
            <img id='iconTranslate' src="/icons/google-translate-32.png" hidden>
            <img id='iconSwap' src="/icons/swap-32.png" hidden>
        </footer>
    </main>

    <script src="/lib/polyfill.js"></script>
    <script src="/lib/checkedLastError.js"></script>
    <script src="/lib/stuff.js"></script>
    <script src="detect-pdf.js"></script>
    <script src="/lib/languages.js"></script>
    <script src="/lib/config.js"></script>
    <script src="/lib/i18n.js"></script>
    <script src="popup.js"></script>
</body>

</html>
